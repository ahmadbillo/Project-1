<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="registration-card" aria-labelledby="form-title">
      <button class="close-btn" type="button" aria-label="Close form">&times;</button>

      <h1 id="form-title">
        <span class="dot">·</span>
        Registration Form
        <span class="dot">·</span>
      </h1>

      <form action="" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country" required>
            <option value="" disabled selected>Select country</option>
            <option value="pakistan">Pakistan</option>
            <option value="india">India</option>
            <option value="afghanistan">Afghanistan</option>
            <option value="united-states">United States</option>
            <option value="united-kingdom">United Kingdom</option>
            <option value="japan">Japan</option>
            <option value="south-korea">South Korea</option>
            <option value="china">China</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="Phone" autocomplete="tel" required>
        </div>

        <div class="form-group password-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password"
            minlength="8" required>
          <span class="password-icon" aria-hidden="true">●</span>
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit,
            sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat.
          </span>
        </label>

        <button class="submit-btn" type="submit">CREATE ACCOUNT</button>

        <p class="signin-text">
          Already have an account?
          <a href="signin.html" target="_blank">Sign in</a>
        </p>
      </form>
    </section>
  </main>

  <footer>
    designed by Ahmed Bilal.
  </footer>
</body>

</html>
